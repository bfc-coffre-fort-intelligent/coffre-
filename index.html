<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="theme-color" content="#12372A">
<link rel="manifest" href="manifest.json">
<title>Coffre, vos documents scolaires</title>
<style>
:root{
  --pine:#12372A; --pine-soft:#DDE8E2; --brass:#B8892F;
  --paper:#F3F5F2; --card:#FFFFFF; --ink:#1A2622; --muted:#55635D;
  --line:#D5DDD8; --danger:#A8362B; --ok:#1F6B45;
}
*{box-sizing:border-box}
[hidden]{display:none!important}
body{margin:0;background:var(--paper);color:var(--ink);
  font:16px/1.5 system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;-webkit-text-size-adjust:100%}
h1,h2{font-family:Georgia,"Times New Roman",serif;line-height:1.2;margin:0}
button,input,select{font:inherit}
:focus-visible{outline:3px solid var(--brass);outline-offset:2px}

.bar{background:var(--pine);color:#fff}
.bar-in{max-width:560px;margin:0 auto;padding:12px 16px;display:flex;align-items:center;justify-content:space-between;gap:12px}
.brand{display:flex;align-items:center;gap:10px;font-family:Georgia,"Times New Roman",serif;font-size:22px;font-weight:700}
.brand svg{width:26px;height:26px;flex:none}

main{max-width:560px;margin:0 auto;padding:22px 16px 56px}

.btn{min-height:48px;padding:0 18px;border-radius:10px;border:1.5px solid var(--pine);
  background:var(--pine);color:#fff;font-weight:600;cursor:pointer}
.btn.ghost{background:transparent;color:var(--pine)}
.btn.small{min-height:40px;padding:0 14px}
.btn.on-dark{background:transparent;border-color:rgba(255,255,255,.55);color:#fff}
.btn.danger{background:transparent;border-color:var(--danger);color:var(--danger)}
.btn.wide{width:100%;margin-top:18px}
.btn[disabled]{opacity:.55;cursor:default}

.panel{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:18px}
label{display:block;font-weight:600;margin:14px 0 6px}
input,select{width:100%;min-height:48px;padding:0 12px;border:1.5px solid var(--line);
  border-radius:10px;background:#fff;color:var(--ink)}
input[type=file]{height:auto;padding:10px 12px}
.hint{color:var(--muted);font-size:14px;margin:6px 0 0}

.hero h1{font-size:28px;margin-bottom:10px}
.hero p{margin:0 0 20px;color:var(--muted)}

.tabs{display:flex;border-bottom:1px solid var(--line);margin:-4px 0 4px}
.tab{flex:1;min-height:48px;background:none;border:0;border-bottom:3px solid transparent;
  font-weight:600;color:var(--muted);cursor:pointer}
.tab[aria-selected="true"]{color:var(--pine);border-bottom-color:var(--brass)}

.notice{margin:14px 0 0;padding:10px 12px;border-radius:10px;font-size:15px}
.notice.error{background:#F8E3E0;color:var(--danger)}
.notice.ok{background:#DFF0E6;color:var(--ok)}

.head{display:flex;align-items:flex-end;justify-content:space-between;gap:12px;margin-bottom:14px}
.head h2{font-size:24px}
.who{color:var(--muted);font-size:14px;overflow-wrap:anywhere}
.tools{display:grid;gap:10px;margin-bottom:14px}

.profiles{display:flex;gap:8px;overflow-x:auto;padding:4px 0 12px;margin:0 0 4px;-webkit-overflow-scrolling:touch}
.profile-chip{flex:none;min-height:44px;padding:0 16px;border-radius:999px;border:1.5px solid var(--line);
  background:#fff;color:var(--ink);font-weight:600;cursor:pointer;white-space:nowrap}
.profile-chip[aria-pressed="true"]{background:var(--pine);border-color:var(--pine);color:#fff}
.profile-chip.add{border-style:dashed;color:var(--pine);background:var(--pine-soft)}

.docs{list-style:none;margin:16px 0 0;padding:0;display:grid;gap:10px}
.doc{background:#fff;border:1px solid var(--line);border-radius:12px;padding:14px}
.doc strong{display:block;overflow-wrap:anywhere}
.meta{color:var(--muted);font-size:14px}
.doc-actions{display:flex;gap:8px;margin-top:10px}
.empty{padding:28px 16px;text-align:center;color:var(--muted);border:1.5px dashed var(--line);border-radius:12px}
.empty strong{display:block;color:var(--ink);margin-bottom:4px}

.toast{position:fixed;left:50%;bottom:20px;transform:translateX(-50%);max-width:calc(100% - 32px);
  background:var(--pine);color:#fff;padding:12px 18px;border-radius:10px;font-size:15px}

.modal-bg{position:fixed;inset:0;background:rgba(18,55,42,.45);display:flex;align-items:flex-end;justify-content:center;z-index:20}
.modal{background:#fff;border-radius:16px 16px 0 0;padding:20px 16px 26px;width:100%;max-width:560px}
.modal h2{font-size:20px;margin-bottom:12px}
.modal-actions{display:flex;gap:10px;margin-top:16px}
.modal-actions .btn{flex:1}
</style>
</head>
<body>

<header class="bar">
  <div class="bar-in">
    <div class="brand">
      <svg viewBox="0 0 24 24" fill="none" stroke="#B8892F" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
        <rect x="4" y="10.5" width="16" height="10" rx="2.5"/>
        <path d="M8 10.5V8a4 4 0 0 1 8 0v2.5"/>
        <circle cx="12" cy="15.5" r="1.3" fill="#B8892F"/>
      </svg>
      Coffre
    </div>
    <button id="sign-out" class="btn small on-dark" type="button" hidden>Se déconnecter</button>
  </div>
</header>

<main>

  <section id="auth-view">
    <div class="hero">
      <h1>Tout le parcours scolaire, au même endroit.</h1>
      <p>Bulletins, certificats, photos de classe : rangés, protégés et retrouvés en quelques secondes.</p>
    </div>
    <div class="panel">
      <div class="tabs" role="tablist">
        <button id="tab-login" class="tab" role="tab" aria-selected="true" type="button">Connexion</button>
        <button id="tab-signup" class="tab" role="tab" aria-selected="false" type="button">Créer un compte</button>
      </div>
      <form id="auth-form" novalidate>
        <label for="email">Adresse e-mail</label>
        <input id="email" type="email" autocomplete="email" inputmode="email" required>
        <label for="password">Mot de passe</label>
        <input id="password" type="password" autocomplete="current-password" minlength="8" required>
        <p class="hint">8 caractères minimum.</p>
        <button id="auth-submit" class="btn wide" type="submit">Se connecter</button>
        <p id="auth-notice" class="notice" role="alert" hidden></p>
      </form>
    </div>
  </section>

  <section id="app-view" hidden>
    <div class="head">
      <div>
        <h2>Mes documents</h2>
        <div id="who" class="who"></div>
      </div>
      <div id="count" class="who"></div>
    </div>

    <div id="profiles" class="profiles" role="tablist" aria-label="Profils"></div>

    <div class="tools">
      <button id="toggle-add" class="btn" type="button" aria-expanded="false" aria-controls="upload-panel">Ajouter un document</button>
    </div>

    <div id="upload-panel" class="panel" hidden>
      <form id="upload-form" novalidate>
        <label for="titre" style="margin-top:0">Titre du document</label>
        <input id="titre" type="text" required>
        <label for="type">Type</label>
        <select id="type">
          <option>Bulletin</option>
          <option>Certificat</option>
          <option>Attestation de réussite</option>
          <option>Diplôme</option>
          <option>Photo d'école</option>
          <option>Vidéo</option>
          <option>Autre</option>
        </select>
        <label for="annee">Année</label>
        <input id="annee" type="number" inputmode="numeric" min="1980" max="2100">
        <label for="etab">Établissement</label>
        <input id="etab" type="text" autocomplete="organization">
        <label for="file">Fichier</label>
        <input id="file" type="file" accept="image/*,video/*,application/pdf,.doc,.docx,.xls,.xlsx,.ppt,.pptx,.txt">
        <p class="hint">Photo, PDF, Word, Excel ou vidéo. 50 Mo maximum.</p>
        <button id="up-submit" class="btn wide" type="submit">Enregistrer dans le coffre</button>
        <p id="up-notice" class="notice" role="alert" hidden></p>
      </form>
    </div>

    <label for="search" style="margin-top:18px">Rechercher</label>
    <input id="search" type="search" placeholder="Titre, type, année, établissement">

    <ul id="docs" class="docs"></ul>
  </section>

</main>

<div id="profile-modal-bg" class="modal-bg" hidden>
  <div class="modal">
    <h2>Ajouter un profil</h2>
    <form id="profile-form" novalidate>
      <label for="profile-name" style="margin-top:0">Prénom de l'enfant, ou nom du profil</label>
      <input id="profile-name" type="text" required autocomplete="off">
      <p id="profile-notice" class="notice" role="alert" hidden></p>
      <div class="modal-actions">
        <button id="profile-cancel" class="btn ghost" type="button">Annuler</button>
        <button class="btn" type="submit">Ajouter</button>
      </div>
    </form>
  </div>
</div>

<div id="toast" class="toast" role="status" hidden></div>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="theme-color" content="#12372A">
<link rel="manifest" href="manifest.json">
<title>Coffre, vos documents scolaires</title>
<style>
:root{
  --pine:#12372A; --pine-soft:#DDE8E2; --brass:#B8892F;
  --paper:#F3F5F2; --card:#FFFFFF; --ink:#1A2622; --muted:#55635D;
  --line:#D5DDD8; --danger:#A8362B; --ok:#1F6B45;
}
*{box-sizing:border-box}
[hidden]{display:none!important}
body{margin:0;background:var(--paper);color:var(--ink);
  font:16px/1.5 system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;-webkit-text-size-adjust:100%}
h1,h2{font-family:Georgia,"Times New Roman",serif;line-height:1.2;margin:0}
button,input,select{font:inherit}
:focus-visible{outline:3px solid var(--brass);outline-offset:2px}

.bar{background:var(--pine);color:#fff}
.bar-in{max-width:560px;margin:0 auto;padding:12px 16px;display:flex;align-items:center;justify-content:space-between;gap:12px}
.brand{display:flex;align-items:center;gap:10px;font-family:Georgia,"Times New Roman",serif;font-size:22px;font-weight:700}
.brand svg{width:26px;height:26px;flex:none}

main{max-width:560px;margin:0 auto;padding:22px 16px 56px}

.btn{min-height:48px;padding:0 18px;border-radius:10px;border:1.5px solid var(--pine);
  background:var(--pine);color:#fff;font-weight:600;cursor:pointer}
.btn.ghost{background:transparent;color:var(--pine)}
.btn.small{min-height:40px;padding:0 14px}
.btn.on-dark{background:transparent;border-color:rgba(255,255,255,.55);color:#fff}
.btn.danger{background:transparent;border-color:var(--danger);color:var(--danger)}
.btn.wide{width:100%;margin-top:18px}
.btn[disabled]{opacity:.55;cursor:default}

.panel{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:18px}
label{display:block;font-weight:600;margin:14px 0 6px}
input,select{width:100%;min-height:48px;padding:0 12px;border:1.5px solid var(--line);
  border-radius:10px;background:#fff;color:var(--ink)}
input[type=file]{height:auto;padding:10px 12px}
.hint{color:var(--muted);font-size:14px;margin:6px 0 0}

.hero h1{font-size:28px;margin-bottom:10px}
.hero p{margin:0 0 20px;color:var(--muted)}

.tabs{display:flex;border-bottom:1px solid var(--line);margin:-4px 0 4px}
.tab{flex:1;min-height:48px;background:none;border:0;border-bottom:3px solid transparent;
  font-weight:600;color:var(--muted);cursor:pointer}
.tab[aria-selected="true"]{color:var(--pine);border-bottom-color:var(--brass)}

.notice{margin:14px 0 0;padding:10px 12px;border-radius:10px;font-size:15px}
.notice.error{background:#F8E3E0;color:var(--danger)}
.notice.ok{background:#DFF0E6;color:var(--ok)}

.head{display:flex;align-items:flex-end;justify-content:space-between;gap:12px;margin-bottom:14px}
.head h2{font-size:24px}
.who{color:var(--muted);font-size:14px;overflow-wrap:anywhere}
.tools{display:grid;gap:10px;margin-bottom:14px}

.profiles{display:flex;gap:8px;overflow-x:auto;padding:4px 0 12px;margin:0 0 4px;-webkit-overflow-scrolling:touch}
.profile-chip{flex:none;min-height:44px;padding:0 16px;border-radius:999px;border:1.5px solid var(--line);
  background:#fff;color:var(--ink);font-weight:600;cursor:pointer;white-space:nowrap}
.profile-chip[aria-pressed="true"]{background:var(--pine);border-color:var(--pine);color:#fff}
.profile-chip.add{border-style:dashed;color:var(--pine);background:var(--pine-soft)}

.docs{list-style:none;margin:16px 0 0;padding:0;display:grid;gap:10px}
.doc{background:#fff;border:1px solid var(--line);border-radius:12px;padding:14px}
.doc strong{display:block;overflow-wrap:anywhere}
.meta{color:var(--muted);font-size:14px}
.doc-actions{display:flex;gap:8px;margin-top:10px}
.empty{padding:28px 16px;text-align:center;color:var(--muted);border:1.5px dashed var(--line);border-radius:12px}
.empty strong{display:block;color:var(--ink);margin-bottom:4px}

.toast{position:fixed;left:50%;bottom:20px;transform:translateX(-50%);max-width:calc(100% - 32px);
  background:var(--pine);color:#fff;padding:12px 18px;border-radius:10px;font-size:15px}

.modal-bg{position:fixed;inset:0;background:rgba(18,55,42,.45);display:flex;align-items:flex-end;justify-content:center;z-index:20}
.modal{background:#fff;border-radius:16px 16px 0 0;padding:20px 16px 26px;width:100%;max-width:560px}
.modal h2{font-size:20px;margin-bottom:12px}
.modal-actions{display:flex;gap:10px;margin-top:16px}
.modal-actions .btn{flex:1}
</style>
</head>
<body>

<header class="bar">
  <div class="bar-in">
    <div class="brand">
      <svg viewBox="0 0 24 24" fill="none" stroke="#B8892F" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
        <rect x="4" y="10.5" width="16" height="10" rx="2.5"/>
        <path d="M8 10.5V8a4 4 0 0 1 8 0v2.5"/>
        <circle cx="12" cy="15.5" r="1.3" fill="#B8892F"/>
      </svg>
      Coffre
    </div>
    <button id="sign-out" class="btn small on-dark" type="button" hidden>Se déconnecter</button>
  </div>
</header>

<main>

  <section id="auth-view">
    <div class="hero">
      <h1>Tout le parcours scolaire, au même endroit.</h1>
      <p>Bulletins, certificats, photos de classe : rangés, protégés et retrouvés en quelques secondes.</p>
    </div>
    <div class="panel">
      <div class="tabs" role="tablist">
        <button id="tab-login" class="tab" role="tab" aria-selected="true" type="button">Connexion</button>
        <button id="tab-signup" class="tab" role="tab" aria-selected="false" type="button">Créer un compte</button>
      </div>
      <form id="auth-form" novalidate>
        <label for="email">Adresse e-mail</label>
        <input id="email" type="email" autocomplete="email" inputmode="email" required>
        <label for="password">Mot de passe</label>
        <input id="password" type="password" autocomplete="current-password" minlength="8" required>
        <p class="hint">8 caractères minimum.</p>
        <button id="auth-submit" class="btn wide" type="submit">Se connecter</button>
        <p id="auth-notice" class="notice" role="alert" hidden></p>
      </form>
    </div>
  </section>

  <section id="app-view" hidden>
    <div class="head">
      <div>
        <h2>Mes documents</h2>
        <div id="who" class="who"></div>
      </div>
      <div id="count" class="who"></div>
    </div>

    <div id="profiles" class="profiles" role="tablist" aria-label="Profils"></div>

    <div class="tools">
      <button id="toggle-add" class="btn" type="button" aria-expanded="false" aria-controls="upload-panel">Ajouter un document</button>
    </div>

    <div id="upload-panel" class="panel" hidden>
      <form id="upload-form" novalidate>
        <label for="titre" style="margin-top:0">Titre du document</label>
        <input id="titre" type="text" required>
        <label for="type">Type</label>
        <select id="type">
          <option>Bulletin</option>
          <option>Certificat</option>
          <option>Attestation de réussite</option>
          <option>Diplôme</option>
          <option>Photo d'école</option>
          <option>Vidéo</option>
          <option>Autre</option>
        </select>
        <label for="annee">Année</label>
        <input id="annee" type="number" inputmode="numeric" min="1980" max="2100">
        <label for="etab">Établissement</label>
        <input id="etab" type="text" autocomplete="organization">
        <label for="file">Fichier</label>
        <input id="file" type="file" accept="image/*,video/*,application/pdf,.doc,.docx,.xls,.xlsx,.ppt,.pptx,.txt">
        <p class="hint">Photo, PDF, Word, Excel ou vidéo. 50 Mo maximum.</p>
        <button id="up-submit" class="btn wide" type="submit">Enregistrer dans le coffre</button>
        <p id="up-notice" class="notice" role="alert" hidden></p>
      </form>
    </div>

    <label for="search" style="margin-top:18px">Rechercher</label>
    <input id="search" type="search" placeholder="Titre, type, année, établissement">

    <ul id="docs" class="docs"></ul>
  </section>

</main>

<div id="profile-modal-bg" class="modal-bg" hidden>
  <div class="modal">
    <h2>Ajouter un profil</h2>
    <form id="profile-form" novalidate>
      <label for="profile-name" style="margin-top:0">Prénom de l'enfant, ou nom du profil</label>
      <input id="profile-name" type="text" required autocomplete="off">
      <p id="profile-notice" class="notice" role="alert" hidden></p>
      <div class="modal-actions">
        <button id="profile-cancel" class="btn ghost" type="button">Annuler</button>
        <button class="btn" type="submit">Ajouter</button>
      </div>
    </form>
  </div>
</div>

<div id="toast" class="toast" role="status" hidden></div>

    st.textContent =
      ".chk{display:flex;gap:10px;align-items:flex-start;margin:12px 0 0;font-weight:400;line-height:1.4}" +
      ".chk input{width:auto;min-height:0;margin:3px 0 0;flex:none;transform:scale(1.25)}" +
      "#signup-consents{margin-top:6px}" +
      "#signup-consents small{display:block;color:var(--muted);margin-top:2px}" +
      "#ia-switch{margin:6px 0 10px}" +
      "#consent-gate{position:fixed;inset:0;background:var(--paper);z-index:70;overflow:auto;padding:20px 16px}" +
      "#consent-gate[hidden]{display:none}" +
      "#consent-gate .in{max-width:560px;margin:0 auto}";
    document.head.appendChild(st);

    var LINKS = '<a href="conditions.html" target="_blank" rel="noopener">conditions d\'utilisation</a> et la ' +
      '<a href="confidentialite.html" target="_blank" rel="noopener">politique de confidentialité</a>';
    var IA_TXT = 'Oui, proposer automatiquement un titre pour mes documents.' +
      '<small>Une copie du document est envoyée à une intelligence artificielle (Anthropic), uniquement pour cela. Vous pouvez changer d\'avis à tout moment.</small>';

    // 1) Cases à cocher à l'inscription
    var box = document.createElement("div");
    box.id = "signup-consents";
    box.hidden = true;
    box.innerHTML =
      '<label class="chk"><input type="checkbox" id="cgu-chk"><span>J\'accepte les ' + LINKS + '. <em>(obligatoire)</em></span></label>' +
      '<label class="chk"><input type="checkbox" id="ia-chk"><span>' + IA_TXT + ' <em>(facultatif)</em></span></label>';
    authForm.insertBefore(box, $("auth-submit"));
    function syncBox() { box.hidden = mode !== "signup"; }
    $("tab-login").addEventListener("click", syncBox);
    $("tab-signup").addEventListener("click", syncBox);

    authForm.addEventListener("submit", function (e) {
      if (mode !== "signup") return;
      if (!$("cgu-chk").checked) {
        e.preventDefault();
        e.stopImmediatePropagation();
        setNotice(authNotice, "Pour créer un compte, cochez la case d'acceptation des conditions et de la politique de confidentialité.", "error");
      }
    }, true);

    var origSignUp = db.auth.signUp.bind(db.auth);
    db.auth.signUp = function (args) {
      var now = new Date().toISOString();
      args = args || {};
      args.options = args.options || {};
      args.options.data = Object.assign({}, args.options.data, {
        cgu_accepte_le: now,
        ia_consent: $("ia-chk").checked,
        ia_consent_le: now,
        version_textes: VERSION
      });
      return origSignUp(args);
    };

    // 2) L'envoi à l'IA n'a lieu que si la famille a accepté
    var origInvoke = db.functions.invoke.bind(db.functions);
    db.functions.invoke = function (name, opts) {
      if (name === "classer-document" && !iaOn) {
        return Promise.resolve({ data: null, error: { message: "ia_desactivee" } });
      }
      return origInvoke(name, opts);
    };

    // 3) Interrupteur sur l'écran d'ajout
    var sw = document.createElement("label");
    sw.className = "chk";
    sw.id = "ia-switch";
    sw.innerHTML = '<input type="checkbox" id="ia-sw"><span>Titre automatique par IA <small>Une copie de la photo est envoyée à une IA pour proposer le titre.</small></span>';
    var tl = uploadForm.querySelector('label[for="titre"]');
    if (tl) tl.parentNode.insertBefore(sw, tl); else uploadForm.insertBefore(sw, uploadForm.firstChild);
    $("ia-sw").addEventListener("change", function () {
      saveConsent(null, this.checked, "interrupteur");
    });

    function reflect() { $("ia-sw").checked = iaOn; }

    // 4) Enregistrer / retrouver les consentements
    async function history(rows) {
      try { await db.from("consentements").insert(rows); } catch (e) {}
    }
    async function saveConsent(cgu, ia, source) {
      var now = new Date().toISOString();
      var data = { ia_consent: ia, ia_consent_le: now, version_textes: VERSION };
      var rows = [{ type: "ia", accepte: ia, source: source, version_textes: VERSION, cree_le: now }];
      if (cgu) {
        data.cgu_accepte_le = now;
        rows.push({ type: "conditions", accepte: true, source: source, version_textes: VERSION, cree_le: now });
      }
      var r = await db.auth.updateUser({ data: data });
      if (r && r.error) {
        showToast("Enregistrement impossible : " + fr(r.error.message));
        reflect();
        return false;
      }
      iaOn = ia;
      if (cgu) cguOk = true;
      reflect();
      history(rows);
      return true;
    }

    async function syncHistory(user) {
      var md = user.user_metadata || {};
      if (!md.cgu_accepte_le) return;
      var r = await db.from("consentements").select("id");
      if (r.error || (r.data && r.data.length)) return;
      history([
        { type: "conditions", accepte: true, source: "inscription", version_textes: md.version_textes || VERSION, cree_le: md.cgu_accepte_le },
        { type: "ia", accepte: md.ia_consent === true, source: "inscription", version_textes: md.version_textes || VERSION, cree_le: md.ia_consent_le || md.cgu_accepte_le }
      ]);
    }

    // 5) Écran de consentement pour les comptes qui n'ont pas encore accepté
    var gate = document.createElement("div");
    gate.id = "consent-gate";
    gate.hidden = true;
    gate.innerHTML =
      '<div class="in"><h1>Avant de continuer</h1>' +
      '<p class="hint">Pour utiliser le Coffre, merci de lire et d\'accepter nos règles.</p>' +
      '<div class="panel" style="margin-top:16px">' +
      '<label class="chk" style="margin-top:0"><input type="checkbox" id="g-cgu"><span>J\'accepte les ' + LINKS + '. <em>(obligatoire)</em></span></label>' +
      '<label class="chk"><input type="checkbox" id="g-ia"><span>' + IA_TXT + ' <em>(facultatif)</em></span></label>' +
      '<button id="g-ok" class="btn wide" type="button" disabled>Continuer</button>' +
      '<button id="g-out" class="btn ghost wide" type="button">Se déconnecter</button>' +
      '<p id="g-msg" class="notice" role="alert" hidden></p></div></div>';
    document.body.appendChild(gate);
    $("g-cgu").addEventListener("change", function () { $("g-ok").disabled = !this.checked; });
    $("g-out").addEventListener("click", function () { gate.hidden = true; gateOpen = false; db.auth.signOut(); });
    $("g-ok").addEventListener("click", async function () {
      var ok = await saveConsent(true, $("g-ia").checked, "ecran-consentement");
      if (ok) { gate.hidden = true; gateOpen = false; }
      else setNotice($("g-msg"), "Enregistrement impossible. Réessayez.", "error");
    });

    function apply(event, user) {
      curUser = user || null;
      var md = (user && user.user_metadata) || {};
      iaOn = md.ia_consent === true;
      cguOk = !!md.cgu_accepte_le;
      reflect();
      if (!user) { gate.hidden = true; gateOpen = false; return; }
      if (event === "PASSWORD_RECOVERY") return;
      if (!cguOk) {
        if (!gateOpen) { $("g-cgu").checked = false; $("g-ia").checked = false; $("g-ok").disabled = true; gate.hidden = false; gateOpen = true; }
      } else {
        syncHistory(user);
      }
    }
    db.auth.onAuthStateChange(function (event, session) {
      setTimeout(function () { apply(event, session && session.user); }, 50);
    });
  })();
  async function loadProfiles() {
    var r = await db.from("profils").select("*").order("cree_le", { ascending: true });
    if (r.error) { showToast(fr(r.error.message)); return; }
    profiles = r.data || [];
    renderProfiles();
  }

  function renderProfiles() {
    var chips = [];
    chips.push(
      '<button class="profile-chip" type="button" role="tab" data-id="self" aria-pressed="' +
      (selectedProfileId === "self") + '">Moi-même</button>'
    );
    profiles.forEach(function (p) {
      chips.push(
        '<button class="profile-chip" type="button" role="tab" data-id="' + esc(p.id) + '" aria-pressed="' +
        (selectedProfileId === p.id) + '">' + esc(p.nom) + '</button>'
      );
    });
    chips.push('<button class="profile-chip add" type="button" id="add-profile">+ Ajouter un profil</button>');
    profilesBar.innerHTML = chips.join("");

    profilesBar.querySelectorAll(".profile-chip[data-id]").forEach(function (btn) {
      btn.addEventListener("click", function () {
        selectedProfileId = btn.getAttribute("data-id");
        renderProfiles();
        renderDocs();
      });
    });
    var addBtn = $("add-profile");
    if (addBtn) addBtn.addEventListener("click", openProfileModal);
  }

  function openProfileModal() {
    profileForm.reset();
    setNotice(profileNotice, "");
    profileModalBg.hidden = false;
    $("profile-name").focus();
  }
  function closeProfileModal() { profileModalBg.hidden = true; }

  $("profile-cancel").addEventListener("click", closeProfileModal);
  profileModalBg.addEventListener("click", function (e) {
    if (e.target === profileModalBg) closeProfileModal();
  });

  profileForm.addEventListener("submit", async function (e) {
    e.preventDefault();
    var nom = $("profile-name").value.trim();
    if (!nom) { setNotice(profileNotice, "Donnez un nom à ce profil.", "error"); return; }
    var r = await db.from("profils").insert({ nom: nom }).select().single();
    if (r.error) { setNotice(profileNotice, fr(r.error.message), "error"); return; }
    profiles.push(r.data);
    selectedProfileId = r.data.id;
    closeProfileModal();
    renderProfiles();
    renderDocs();
    showToast("Profil « " + nom + " » ajouté.");
  });

  async function loadDocs() {
    var r = await db.from("documents").select("*").order("cree_le", { ascending: false });
    if (r.error) { showToast(fr(r.error.message)); return; }
    docs = r.data || [];
    renderDocs();
  }

  function docsForSelectedProfile() {
    if (selectedProfileId === "self") {
      return docs.filter(function (d) { return !d.profil_id; });
    }
    return docs.filter(function (d) { return d.profil_id === selectedProfileId; });
  }

  function renderDocs() {
    var q = norm(search.value);
    var scoped = docsForSelectedProfile();
    var shown = scoped.filter(function (d) {
      return !q || norm([d.titre, d.type, d.etablissement, d.annee].join(" ")).indexOf(q) > -1;
    });
    $("count").textContent = docs.length ? docs.length + (docs.length > 1 ? " documents au total" : " document au total") : "";

    if (!scoped.length) {
      list.innerHTML = '<li class="empty"><strong>Ce coffre est vide.</strong>Ajoutez un premier document pour ce profil.</li>';
      return;
    }
    if (!shown.length) {
      list.innerHTML = '<li class="empty"><strong>Aucun résultat.</strong>Essayez un autre mot, ou une autre année.</li>';
      return;
    }
    list.innerHTML = shown.map(function (d) {
      var meta = [d.type, d.annee, d.etablissement, fmtSize(d.taille_octets)].filter(Boolean).join(", ");
      return '<li class="doc">' +
        '<strong>' + esc(d.titre) + '</strong>' +
        '<div class="meta">' + esc(meta) + '</div>' +
        '<div class="doc-actions">' +
          '<button class="btn small" type="button" data-act="open" data-id="' + esc(d.id) + '">Ouvrir</button>' +
          '<button class="btn small danger" type="button" data-act="del" data-id="' + esc(d.id) + '">Supprimer</button>' +
        '</div></li>';
    }).join("");
  }

  search.addEventListener("input", renderDocs);

  list.addEventListener("click", function (e) {
    var btn = e.target.closest("button[data-act]");
    if (!btn) return;
    var d = docs.find(function (x) { return x.id === btn.getAttribute("data-id"); });
    if (!d) return;
    if (btn.getAttribute("data-act") === "open") openDoc(d); else deleteDoc(d);
  });

  async function openDoc(d) {
    var w = window.open("", "_blank");
    var r = await db.storage.from(BUCKET).createSignedUrl(d.chemin_fichier, 120);
    if (r.error) {
      if (w) w.close();
      showToast("Impossible d'ouvrir ce document.");
      return;
    }
    if (w) w.location.href = r.data.signedUrl; else window.location.href = r.data.signedUrl;
  }

  async function deleteDoc(d) {
    if (!window.confirm("Supprimer « " + d.titre + " » définitivement ?")) return;
    var f = await db.storage.from(BUCKET).remove([d.chemin_fichier]);
    if (f.error) { showToast("Suppression impossible : " + fr(f.error.message)); return; }
    var r = await db.from("documents").delete().eq("id", d.id);
    if (r.error) { showToast("Suppression impossible : " + fr(r.error.message)); return; }
    showToast("Document supprimé.");
    loadDocs();
  }

  $("toggle-add").addEventListener("click", function () {
    var open = uploadPanel.hidden;
    uploadPanel.hidden = !open;
    this.setAttribute("aria-expanded", String(open));
    if (open) {
      if (!$("annee").value) $("annee").value = new Date().getFullYear();
      $("titre").focus();
    }
  });

  function fileToBase64(file) {
    return new Promise(function (resolve, reject) {
      var reader = new FileReader();
      reader.onload = function () {
        var result = reader.result;
        var base64 = result.slice(result.indexOf(",") + 1);
        resolve(base64);
      };
      reader.onerror = reject;
      reader.readAsDataURL(file);
    });
  }

  $("file").addEventListener("change", async function () {
    var file = this.files[0];
    if (!file || file.type.indexOf("image/") !== 0) return;

    setNotice(upNotice, "Analyse du document par l'IA…", "");
    try {
      var base64 = await fileToBase64(file);
      var res = await db.functions.invoke("classer-document", {
        body: { image: base64, mediaType: file.type }
      });
      if (res.error) throw res.error;
      var s = res.data || {};
      if (s.titre && !$("titre").value) $("titre").value = s.titre;
      if (s.type) {
        var options = $("type").options;
        for (var i = 0; i < options.length; i++) {
          if (options[i].value === s.type) { $("type").value = s.type; break; }
        }
      }
      if (s.annee && !$("annee").value) $("annee").value = s.annee;
      if (s.etablissement && !$("etab").value) $("etab").value = s.etablissement;
      setNotice(upNotice, "Suggestions ajoutées par l'IA. Vérifiez avant d'enregistrer.", "ok");
    } catch (err) {
      setNotice(upNotice, "");
    }
  });

  uploadForm.addEventListener("submit", async function (e) {
    e.preventDefault();
    var file = $("file").files[0];
    var titre = $("titre").value.trim();
    if (!titre) { setNotice(upNotice, "Donnez un titre au document.", "error"); return; }
    if (!file) { setNotice(upNotice, "Choisissez un fichier à ajouter.", "error"); return; }
    if (file.size > MAX_BYTES) { setNotice(upNotice, "Ce fichier dépasse 50 Mo. Choisissez un fichier plus léger.", "error"); return; }

    var btn = $("up-submit");
    btn.disabled = true;
    btn.textContent = "Envoi en cours…";
    setNotice(upNotice, "");

    var path = currentUser.id + "/" + uid() + "-" + safeName(file.name);
    try {
      var up = await db.storage.from(BUCKET).upload(path, file, {
        contentType: file.type || "application/octet-stream"
      });
      if (up.error) throw up.error;

      var ins = await db.from("documents").insert({
        titre: titre,
        type: $("type").value,
        annee: $("annee").value ? Number($("annee").value) : null,
        etablissement: $("etab").value.trim() || null,
        chemin_fichier: path,
        taille_octets: file.size,
        profil_id: selectedProfileId === "self" ? null : selectedProfileId
      });
      if (ins.error) {
        await db.storage.from(BUCKET).remove([path]);
        throw ins.error;
      }

      uploadForm.reset();
      $("annee").value = new Date().getFullYear();
      uploadPanel.hidden = true;
      $("toggle-add").setAttribute("aria-expanded", "false");
      showToast("Document ajouté au coffre.");
      await loadDocs();
    } catch (err) {
      setNotice(upNotice, fr(err.message), "error");
    } finally {
      btn.disabled = false;
      btn.textContent = "Enregistrer dans le coffre";
    }
  });
})();
</script>
</body>
</html>
